<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Circular com Gradiente Moderno -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Comprovante Térmico Saindo do Topo (Com Serrilhado) -->
  <path d="M 180 160 L 180 65 
           L 190 73 L 200 65 L 210 73 L 220 65 L 230 73 L 240 65 
           L 250 73 L 260 65 L 270 73 L 280 65 L 290 73 L 300 65 
           L 310 73 L 320 65 L 330 73 L 332 160 Z" fill="#f8fafc"/>
  
  <!-- Detalhes no Comprovante -->
  <line x1="200" y1="90" x2="312" y2="90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="105" x2="280" y2="105" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="120" x2="295" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <!-- Destaque do Valor no Papel -->
  <rect x="200" y="132" width="70" height="12" rx="3" fill="#2563eb"/>

  <!-- Corpo da Maquininha (Base & Lateral) -->
  <rect x="156" y="140" width="200" height="310" rx="32" fill="#0f172a"/>
  <!-- Bordas/Brumas da Maquininha -->
  <rect x="162" y="146" width="188" height="298" rx="28" fill="#1e293b"/>

  <!-- Saída/Guilhotina do Papel -->
  <rect x="176" y="152" width="160" height="10" rx="5" fill="#0f172a"/>

  <!-- Tela Touchscreen Smart -->
  <rect x="176" y="175" width="160" height="210" rx="14" fill="url(#screenGrad)"/>
  
  <!-- Conteúdo da Tela da Maquininha -->
  <!-- Sinal / Bateria Topo -->
  <circle cx="190" cy="190" r="3" fill="#22c55e"/>
  <line x1="310" y1="190" x2="324" y2="190" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Ícone Contactless / Aproximação na Tela -->
  <path d="M 242 220 A 12 12 0 0 1 270 248" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 236 214 A 20 20 0 0 1 276 254" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="248" cy="242" r="3" fill="#38bdf8"/>

  <!-- Texto de Valor Aprovado na Tela -->
  <rect x="196" y="275" width="120" height="22" rx="6" fill="#1e3a8a"/>
  <text x="256" y="291" font-family="sans-serif" font-weight="bold" font-size="12" fill="#60a5fa" text-anchor="middle">R$ 150,00</text>

  <!-- Botão / Status Verde de Aprovado -->
  <rect x="216" y="310" width="80" height="20" rx="10" fill="#16a34a"/>
  <path d="M 248 320 L 254 325 L 265 314" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Teclado Físico / Botões Inferiores -->
  <rect x="180" y="398" width="40" height="16" rx="4" fill="#334155"/>
  <rect x="236" y="398" width="40" height="16" rx="4" fill="#334155"/>
  <rect x="292" y="398" width="40" height="16" rx="4" fill="#22c55e"/>

  <!-- Cartão de Crédito Inserido na Entrada Inferior -->
  <rect x="206" y="430" width="100" height="50" rx="8" fill="url(#cardGrad)"/>
  <!-- Chip Dourado do Cartão -->
  <rect x="220" y="442" width="18" height="14" rx="3" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
</svg>
