<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Fundo e Tela -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Fundo Principal Circular -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Comprovante Térmico Saindo do Topo -->
  <path d="M 180 150 L 180 55 
           L 190 63 L 200 55 L 210 63 L 220 55 L 230 63 L 240 55 
           L 250 63 L 260 55 L 270 63 L 280 55 L 290 63 L 300 55 
           L 310 63 L 320 55 L 330 63 L 332 150 Z" fill="#f8fafc"/>
  
  <!-- Detalhes no Comprovante -->
  <line x1="200" y1="80" x2="312" y2="80" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="95" x2="280" y2="95" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="110" x2="295" y2="110" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <rect x="200" y="122" width="70" height="12" rx="3" fill="#2563eb"/>

  <!-- Corpo da Maquininha -->
  <rect x="156" y="130" width="200" height="320" rx="32" fill="#0f172a"/>
  <rect x="162" y="136" width="188" height="308" rx="28" fill="#1e293b"/>

  <!-- Saída/Guilhotina do Papel -->
  <rect x="176" y="142" width="160" height="10" rx="5" fill="#0f172a"/>

  <!-- Tela Touchscreen Smart -->
  <rect x="176" y="165" width="160" height="195" rx="14" fill="url(#screenGrad)"/>
  
  <!-- Detalhes da Tela -->
  <circle cx="190" cy="180" r="3" fill="#22c55e"/>
  <line x1="310" y1="180" x2="324" y2="180" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Ícone Contactless / Aproximação -->
  <path d="M 242 208 A 12 12 0 0 1 270 236" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 236 202 A 20 20 0 0 1 276 242" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="248" cy="230" r="3" fill="#38bdf8"/>

  <!-- Valor na Tela -->
  <rect x="196" y="260" width="120" height="22" rx="6" fill="#1e3a8a"/>
  <text x="256" y="276" font-family="sans-serif" font-weight="bold" font-size="12" fill="#60a5fa" text-anchor="middle">R$ 150,00</text>

  <!-- Botão Aprovado -->
  <rect x="216" y="295" width="80" height="20" rx="10" fill="#16a34a"/>
  <path d="M 248 305 L 254 310 L 265 299" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- NOME RECIBOBOX NA MÁQUINA -->
  <text x="256" y="392" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#textGrad)" text-anchor="middle" letter-spacing="0.5">ReciboBox</text>

  <!-- Cartão Inserido na Base -->
  <rect x="206" y="420" width="100" height="50" rx="8" fill="url(#cardGrad)"/>
  <rect x="220" y="432" width="18" height="14" rx="3" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
</svg>
