<script>
  let activeStream = null;
  let trackVideo = null;
  let lanternaLigada = false;
  let lancamentos = JSON.parse(localStorage.getItem('lancamentos') || '[]');

  // Trata e limpa as chaves para evitar espaços ou quebras de linha acidentais
  function obterChavesIA() {
    let keys = localStorage.getItem('GEMINI_API_KEYS');
    if (!keys) {
      let keyInput = prompt("Cole suas chaves API do Gemini separadas por vírgula:");
      if (keyInput) {
        keys = keyInput.trim();
        localStorage.setItem('GEMINI_API_KEYS', keys);
      }
    }
    // Remove espaços vazios e itens nulos
    return keys ? keys.split(',').map(k => k.trim()).filter(k => k.length > 10) : [];
  }

  function configurarChavesIA() {
    let atuais = localStorage.getItem('GEMINI_API_KEYS') || '';
    let novas = prompt("Digite suas chaves da API Gemini separadas por vírgula:", atuais);
    if (novas !== null) {
      localStorage.setItem('GEMINI_API_KEYS', novas.trim());
      alert("Chaves atualizadas com sucesso!");
    }
  }

  function aplicarMascaraMoeda(input) {
    let valor = input.value.replace(/\D/g, '');
    if (valor === '') { input.value = ''; return; }
    valor = (parseInt(valor, 10) / 100).toFixed(2);
    valor = valor.replace('.', ',').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
    input.value = 'R$ ' + valor;
  }

  function abrirModalManual() {
    document.getElementById('inputValor').value = '';
    document.getElementById('modalManual').style.display = 'flex';
    setTimeout(() => document.getElementById('inputValor').focus(), 100);
  }

  function fecharModalManual() {
    document.getElementById('modalManual').style.display = 'none';
  }

  async function abrirCameraDireta() {
    const chaves = obterChavesIA();
    if (chaves.length === 0) return alert("Adicione ao menos uma chave de API para continuar.");

    lanternaLigada = false;
    document.getElementById('btnTorch').style.display = 'none';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
      }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

      activeStream = stream;
      trackVideo = stream.getVideoTracks()[0];

      if (trackVideo && trackVideo.getCapabilities) {
        const caps = trackVideo.getCapabilities();
        if (caps.torch) document.getElementById('btnTorch').style.display = 'block';
      }

      document.getElementById('videoElement').srcObject = stream;
      document.getElementById('modalCamera').style.display = 'flex';
    } catch (err) {
      alert("Erro ao acessar a câmera.");
    }
  }

  async function alternarLanterna() {
    if (!trackVideo) return;
    lanternaLigada = !lanternaLigada;
    try {
      await trackVideo.applyConstraints({ advanced: [{ torch: lanternaLigada }] });
      document.getElementById('btnTorch').innerText = lanternaLigada ? "🔦 Desligar" : "🔦 Lanterna";
    } catch (e) {}
  }

  function fecharCameraDireta() {
    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
      trackVideo = null;
    }
    document.getElementById('modalCamera').style.display = 'none';
  }

  async function capturarFotoEReconhecer() {
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasAux');
    const ctx = canvas.getContext('2d');

    // Reduz resolução para 800px max para envio ultrarrápido
    const MAX_LADO = 800;
    let width = video.videoWidth || 800;
    let height = video.videoHeight || 600;

    if (width > height) {
      if (width > MAX_LADO) { height *= MAX_LADO / width; width = MAX_LADO; }
    } else {
      if (height > MAX_LADO) { width *= MAX_LADO / height; height = MAX_LADO; }
    }

    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(video, 0, 0, width, height);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.50);
    const base64Limpo = dataUrl.split(',')[1];

    fecharCameraDireta();
    await enviarParaIA(base64Limpo);
  }

  async function enviarParaIA(base64Limpo) {
    const chaves = obterChavesIA();
    const status = document.getElementById('status');
    status.style.display = 'block';
    status.innerText = "⚡ Enviando e lendo...";

    const promptIA = `Analise o comprovante e retorne APENAS um JSON no seguinte formato exato: {"valor": 00.00, "tipo": "TIPO"}. O tipo deve ser DÉBITO, CRÉDITO, PIX ou VOUCHER.`;

    let sucesso = false;
    let ultimoErro = "";

    // Testa chave por chave até encontrar uma que responda
    for (let i = 0; i < chaves.length; i++) {
      let key = chaves[i];
      try {
        // Modelo 1.5-flash oficial e estável
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptIA },
                { inline_data: { mime_type: "image/jpeg", data: base64Limpo } }
              ]
            }]
          })
        });

        const data = await response.json();

        if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
          let texto = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
          const jsonMatch = texto.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const res = JSON.parse(jsonMatch[0]);
            const valorNum = parseFloat(res.valor);
            let tipoPag = (res.tipo || 'CRÉDITO').toUpperCase();

            if (!['DÉBITO', 'CRÉDITO', 'PIX', 'VOUCHER'].includes(tipoPag)) tipoPag = 'CRÉDITO';

            if (!isNaN(valorNum) && valorNum > 0) {
              lancamentos.push({
                id: Date.now(),
                tipo: tipoPag,
                valor: valorNum,
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
              });
              if (navigator.vibrate) navigator.vibrate(120);
              salvarEAtualizar();
              sucesso = true;
              break; // Sucesso! Sai do loop de chaves.
            }
          }
        } else {
          if (data.error) {
            ultimoErro = `Chave ${i+1}: ${data.error.message || data.error.status}`;
          }
        }
      } catch (err) {
        ultimoErro = `Erro na tentativa ${i+1}`;
      }
    }

    if (!sucesso) {
      alert(`Falha na leitura automática.\nDetalhe: ${ultimoErro || "Verifique suas chaves de API no botão de configurações."}`);
    }

    status.style.display = 'none';
  }

  function salvarManual() {
    const valorStr = document.getElementById('inputValor').value;
    if (!valorStr) return alert('Digite um valor!');

    const valorNum = parseFloat(valorStr.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
    if (isNaN(valorNum) || valorNum <= 0) return alert('Valor inválido!');

    lancamentos.push({
      id: Date.now(),
      tipo: document.getElementById('selectTipo').value,
      valor: valorNum,
      hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
    });

    salvarEAtualizar();
    fecharModalManual();
  }

  function removerItem(id) {
    lancamentos = lancamentos.filter(item => item.id !== id);
    salvarEAtualizar();
  }

  function salvarEAtualizar() {
    localStorage.setItem('lancamentos', JSON.stringify(lancamentos));
    atualizarTela();
  }

  function atualizarTela() {
    const lista = document.getElementById('listaLancamentos');
    lista.innerHTML = '';

    let debito = 0, credito = 0, pix = 0, voucher = 0;

    lancamentos.forEach((item) => {
      if (item.tipo === 'DÉBITO') debito += item.valor;
      if (item.tipo === 'CRÉDITO') credito += item.valor;
      if (item.tipo === 'PIX') pix += item.valor;
      if (item.tipo === 'VOUCHER') voucher += item.valor;

      const li = document.createElement('li');
      li.className = 'list-item';
      li.innerHTML = `
        <div class="item-info">
          <strong>${item.tipo}</strong>
          <small>${item.hora}</small>
        </div>
        <div class="item-actions">
          <strong>R$ ${item.valor.toFixed(2).replace('.', ',')}</strong>
          <button class="btn-danger" onclick="removerItem(${item.id})">✕</button>
        </div>
      `;
      lista.appendChild(li);
    });

    document.getElementById('totalDebito').innerText = `R$ ${debito.toFixed(2).replace('.', ',')}`;
    document.getElementById('totalCredito').innerText = `R$ ${credito.toFixed(2).replace('.', ',')}`;
    document.getElementById('totalPix').innerText = `R$ ${pix.toFixed(2).replace('.', ',')}`;
    document.getElementById('totalVoucher').innerText = `R$ ${voucher.toFixed(2).replace('.', ',')}`;
    
    const totalGeral = debito + credito + pix + voucher;
    document.getElementById('totalGeral').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
    document.getElementById('qtdItens').innerText = `${lancamentos.length} ${lancamentos.length === 1 ? 'item' : 'itens'}`;
  }

  function limparTudo() {
    if (lancamentos.length === 0) return;
    if (confirm('Deseja apagar todos os lançamentos do caixa?')) {
      lancamentos = [];
      salvarEAtualizar();
    }
  }

  atualizarTela();
</script>
