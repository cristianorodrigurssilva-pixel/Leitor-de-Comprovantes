<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReciboBox Pro</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .btn-danger {
            background-color: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c53030;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            color: var(--secondary-color);
            font-weight: 500;
            margin: 10px 0;
            min-height: 20px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .badge {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .item-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-date {
            font-size: 0.75rem;
            color: #718096;
        }

        .item-val {
            font-weight: bold;
            color: #2b6cb0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🧾 ReciboBox Pro</h1>
        </header>

        <div class="actions">
            <button class="btn" onclick="document.getElementById('fileInput').click()">
                📷 Escancear Comprovante
            </button>
            <button class="btn btn-secondary" onclick="abrirModalManual()">
                ➕ Manual
            </button>
        </div>

        <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="processarImagem(event)">

        <div class="status" id="statusMsg"></div>

        <button class="btn btn-secondary" style="width: 100%;" onclick="abrirModalChaves()">
            ⚙️ Gerenciar Chaves da IA
        </button>

        <div class="section-title">
            <h2>Lançamentos</h2>
            <span class="badge" id="totalItems">0 itens</span>
        </div>

        <div class="items-list" id="itemsList"></div>

        <button class="btn btn-danger" style="width: 100%;" onclick="zerarCaixa()">
            Zerar Caixa
        </button>
    </div>

    <!-- Modal Adicionar Manual -->
    <div class="modal" id="modalManual">
        <div class="modal-content">
            <h3>Adicionar Lançamento</h3>
            <input type="text" id="descManual" placeholder="Descrição (ex: Mercado)">
            <input type="number" step="0.01" id="valManual" placeholder="Valor (ex: 45.50)">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="fecharModal('modalManual')">Cancelar</button>
                <button class="btn" onclick="salvarManual()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal Gerenciar Chaves -->
    <div class="modal" id="modalChaves">
        <div class="modal-content">
            <h3>Chaves de API Gemini</h3>
            <p style="font-size: 0.8rem; color: #718096; margin: 0;">Insira até 3 chaves para rotação automática em caso de limite de cota.</p>
            <input type="text" id="key1" placeholder="Chave de API 1">
            <input type="text" id="key2" placeholder="Chave de API 2 (Opcional)">
            <input type="text" id="key3" placeholder="Chave de API 3 (Opcional)">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="fecharModal('modalChaves')">Cancelar</button>
                <button class="btn" onclick="salvarChaves()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let lancamentos = JSON.parse(localStorage.getItem('recibobox_lancamentos')) || [];
        let chavesAPI = JSON.parse(localStorage.getItem('recibobox_chaves')) || ['', '', ''];
        let indiceChaveAtual = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderizarLista();
            carregarChavesInputs();
        });

        function salvarLocalStorage() {
            localStorage.setItem('recibobox_lancamentos', JSON.stringify(lancamentos));
            renderizarLista();
        }

        function renderizarLista() {
            const listEl = document.getElementById('itemsList');
            const totalEl = document.getElementById('totalItems');
            listEl.innerHTML = '';
            
            totalEl.textContent = `${lancamentos.length} item${lancamentos.length !== 1 ? 's' : ''}`;

            lancamentos.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${escapeHtml(item.descricao)}</span>
                        <span class="item-date">${item.data}</span>
                    </div>
                    <span class="item-val">R$ ${parseFloat(item.valor).toFixed(2).replace('.', ',')}</span>
                `;
                listEl.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function abrirModalManual() {
            document.getElementById('descManual').value = '';
            document.getElementById('valManual').value = '';
            document.getElementById('modalManual').style.display = 'flex';
        }

        function fecharModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function salvarManual() {
            const desc = document.getElementById('descManual').value.trim();
            const val = parseFloat(document.getElementById('valManual').value);

            if (!desc || isNaN(val)) {
                alert('Por favor, preencha a descrição e um valor válido.');
                return;
            }

            const novoItem = {
                descricao: desc,
                valor: val,
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            };

            lancamentos.unshift(novoItem);
            salvarLocalStorage();
            fecharModal('modalManual');
        }

        function abrirModalChaves() {
            carregarChavesInputs();
            document.getElementById('modalChaves').style.display = 'flex';
        }

        function carregarChavesInputs() {
            document.getElementById('key1').value = chavesAPI[0] || '';
            document.getElementById('key2').value = chavesAPI[1] || '';
            document.getElementById('key3').value = chavesAPI[2] || '';
        }

        function salvarChaves() {
            chavesAPI = [
                document.getElementById('key1').value.trim(),
                document.getElementById('key2').value.trim(),
                document.getElementById('key3').value.trim()
            ];
            localStorage.setItem('recibobox_chaves', JSON.stringify(chavesAPI));
            fecharModal('modalChaves');
            alert('Chaves salvas com sucesso!');
        }

        function zerarCaixa() {
            if (confirm('Tem certeza de que deseja apagar todos os lançamentos?')) {
                lancamentos = [];
                salvarLocalStorage();
            }
        }

        function setStatus(msg) {
            document.getElementById('statusMsg').textContent = msg;
        }

        async function processarImagem(event) {
            const file = event.target.files[0];
            if (!file) return;

            const chavesValidas = chavesAPI.filter(k => k && k.trim() !== '');
            if (chavesValidas.length === 0) {
                alert('Por favor, cadastre ao menos uma chave de API nas configurações.');
                abrirModalChaves();
                return;
            }

            setStatus('⚡ Enviando e lendo...');

            try {
                const base64Data = await convertBase64(file);
                const resultJSON = await enviarParaIA(base64Data, file.type);
                
                if (resultJSON && resultJSON.descricao && !isNaN(resultJSON.valor)) {
                    const novoItem = {
                        descricao: resultJSON.descricao,
                        valor: parseFloat(resultJSON.valor),
                        data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                    };
                    lancamentos.unshift(novoItem);
                    salvarLocalStorage();
                    setStatus('');
                } else {
                    throw new Error('Formato de resposta inválido da IA.');
                }
            } catch (err) {
                setStatus('');
                alert('Falha na leitura automática.\nDetalhe: ' + err.message);
            } finally {
                event.target.value = '';
            }
        }

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = reader.result;
                    const base64String = result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function enviarParaIA(base64Data, mimeType) {
            const chavesValidas = chavesAPI.map(k => k.trim()).filter(k => k !== '');
            let tentativas = 0;
            let ultimoErro = '';

            while (tentativas < chavesValidas.length) {
                const keyIndex = (indiceChaveAtual + tentativas) % chavesValidas.length;
                const key = chavesValidas[keyIndex];
                
                // Modelo correto para a v1beta do Google AI Studio
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;

                const prompt = "Extraia o nome do estabelecimento/descrição principal e o valor total deste recibo ou comprovante. Responda ESTRITAMENTE em formato JSON puro, sem marcações markdown ou blocos de código: {\"descricao\": \"Nome do local\", \"valor\": 00.00}";

                const bodyData = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            {
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Data
                                }
                            }
                        ]
                    }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || `Erro HTTP ${response.status}`);
                    }

                    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawText) {
                        throw new Error('Resposta vazia da IA.');
                    }

                    const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJson);

                    indiceChaveAtual = (keyIndex + 1) % chavesValidas.length;
                    return parsed;

                } catch (err) {
                    ultimoErro = `Chave ${keyIndex + 1}: ${err.message}`;
                    tentativas++;
                }
            }

            throw new Error(ultimoErro || 'Todas as chaves falharam.');
        }
    </script>
</body>
</html>
