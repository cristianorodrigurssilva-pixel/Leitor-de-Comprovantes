  <script>
    let deferredPrompt;
    const installArea = document.getElementById('installArea');
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installArea.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
        installArea.style.display = 'none';
      }
    });

    let lancamentos = JSON.parse(localStorage.getItem('lancamentos') || '[]');

    function aplicarMascaraMoeda(input) {
      let valor = input.value.replace(/\D/g, '');
      if (valor === '') { input.value = ''; return; }
      valor = (parseInt(valor, 10) / 100).toFixed(2);
      valor = valor.replace('.', ',').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
      input.value = 'R$ ' + valor;
    }

    function abrirModalManual() {
      document.getElementById('inputValor').value = '';
      document.getElementById('modalManual').style.display = 'flex';
      setTimeout(() => document.getElementById('inputValor').focus(), 100);
    }

    function fecharModalManual() {
      document.getElementById('modalManual').style.display = 'none';
    }

    function obterChaveIA() {
      let key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) {
        key = prompt("Cole sua chave da API do Gemini (AIza...):");
        if (key) {
          key = key.trim();
          localStorage.setItem('GEMINI_API_KEY', key);
        }
      }
      return key;
    }

    function redefinirChaveIA() {
      const novaChave = prompt("Digite a nova chave de API do Gemini:");
      if (novaChave) {
        localStorage.setItem('GEMINI_API_KEY', novaChave.trim());
        alert("Chave atualizada com sucesso!");
      }
    }

    async function processarImagem(input) {
      if (!input.files || !input.files[0]) return;

      const apiKey = obterChaveIA();
      if (!apiKey) {
        alert("Você precisa informar a chave para usar a leitura por IA.");
        input.value = '';
        return;
      }

      const status = document.getElementById('status');
      status.style.display = 'block';
      status.innerText = "🤖 Lendo comprovante com IA...";

      try {
        const imagemTratadaBase64 = await otimizarImagemParaOCR(input.files[0]);
        const base64Limpo = imagemTratadaBase64.split(',')[1];

        const promptIA = "Examine o comprovante de pagamento. Extraia o valor total final pago e classifique a forma de pagamento estritamente entre uma destas opções: DÉBITO, CRÉDITO, PIX ou VOUCHER. Retorne APENAS um JSON puro sem marcação de código: {\"valor\": 00.00, \"tipo\": \"TIPO\"}";

        // Endpoint atualizado para o Gemini 2.5 Flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptIA },
                { inline_data: { mime_type: "image/jpeg", data: base64Limpo } }
              ]
            }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let textoResposta = data.candidates[0].content.parts[0].text;
          
          document.getElementById('debugTexto').value = textoResposta;
          document.getElementById('cardDebug').style.display = 'block';

          // Limpa possíveis marcações de bloco de código (```json ... ```)
          textoResposta = textoResposta.replace(/```json/g, '').replace(/```/g, '').trim();

          const jsonMatch = textoResposta.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const resultadoIA = JSON.parse(jsonMatch[0]);
            const valorNum = parseFloat(resultadoIA.valor);
            let tipoPag = (resultadoIA.tipo || 'CRÉDITO').toUpperCase();

            if (!['DÉBITO', 'CRÉDITO', 'PIX', 'VOUCHER'].includes(tipoPag)) {
              tipoPag = 'CRÉDITO';
            }

            if (!isNaN(valorNum) && valorNum > 0) {
              lancamentos.push({
                id: Date.now(),
                tipo: tipoPag,
                valor: valorNum,
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
              });
              salvarEAtualizar();
            } else {
              alert("Não foi possível identificar o valor no comprovante.");
            }
          } else {
            alert("A IA não retornou um formato JSON válido.");
          }
        } else if (data.error) {
          alert("Erro na API: " + data.error.message);
        } else {
          alert("Não foi possível ler o comprovante.");
        }

      } catch (err) {
        console.error(err);
        alert("Erro no processamento da imagem com IA. Verifique sua conexão e a chave de API.");
      } finally {
        status.style.display = 'none';
        input.value = '';
      }
    }

    function otimizarImagemParaOCR(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('canvasAux');
          const ctx = canvas.getContext('2d');
          
          const maxDim = 1200;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          // Envia a imagem em boa qualidade JPEG sem filtros agressivos
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function salvarManual() {
      const valorStr = document.getElementById('inputValor').value;
      if (!valorStr) return alert('Digite um valor!');

      const valorNum = parseFloat(valorStr.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
      if (isNaN(valorNum) || valorNum <= 0) return alert('Valor inválido!');

      lancamentos.push({
        id: Date.now(),
        tipo: document.getElementById('selectTipo').value,
        valor: valorNum,
        hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      });

      salvarEAtualizar();
      fecharModalManual();
    }

    function removerItem(id) {
      lancamentos = lancamentos.filter(item => item.id !== id);
      salvarEAtualizar();
    }

    function salvarEAtualizar() {
      localStorage.setItem('lancamentos', JSON.stringify(lancamentos));
      atualizarTela();
    }

    function atualizarTela() {
      const lista = document.getElementById('listaLancamentos');
      lista.innerHTML = '';

      let debito = 0, credito = 0, pix = 0, voucher = 0;

      lancamentos.forEach((item) => {
        if (item.tipo === 'DÉBITO') debito += item.valor;
        if (item.tipo === 'CRÉDITO') credito += item.valor;
        if (item.tipo === 'PIX') pix += item.valor;
        if (item.tipo === 'VOUCHER') voucher += item.valor;

        const li = document.createElement('li');
        li.className = 'list-item';
        li.innerHTML = `
          <div class="item-info">
            <strong>${item.tipo}</strong>
            <small>${item.hora}</small>
          </div>
          <div class="item-actions">
            <strong>R$ ${item.valor.toFixed(2).replace('.', ',')}</strong>
            <button class="btn-danger" onclick="removerItem(${item.id})">✕</button>
          </div>
        `;
        lista.appendChild(li);
      });

      document.getElementById('totalDebito').innerText = `R$ ${debito.toFixed(2).replace('.', ',')}`;
      document.getElementById('totalCredito').innerText = `R$ ${credito.toFixed(2).replace('.', ',')}`;
      document.getElementById('totalPix').innerText = `R$ ${pix.toFixed(2).replace('.', ',')}`;
      document.getElementById('totalVoucher').innerText = `R$ ${voucher.toFixed(2).replace('.', ',')}`;
      
      const totalGeral = debito + credito + pix + voucher;
      document.getElementById('totalGeral').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
      document.getElementById('qtdItens').innerText = `${lancamentos.length} ${lancamentos.length === 1 ? 'item' : 'itens'}`;
    }

    function limparTudo() {
      if (lancamentos.length === 0) return;
      if (confirm('Deseja apagar todos os lançamentos do caixa?')) {
        lancamentos = [];
        salvarEAtualizar();
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    atualizarTela();
  </script>
